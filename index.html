<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Chatbot Fundamentum · Soporte</title>
<meta name="description" content="Tu tutor de Meta Ads del curso Fundamentum Ads. Resuelve tus dudas al instante.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG VISUAL — Fundamentum Ads / Imperians Academy
     ============================================================ */
  :root{
    --navy:        #111010;   /* base de marca — negro */
    --navy-deep:   #050505;   /* profundidad — negro puro */
    --navy-panel:  #1C1A17;   /* burbujas usuario / inputs */
    --gold:        #DABE68;   /* acento — el hilo de oro */
    --gold-soft:   #c9ad5a;
    --cream:       #F5F2EA;   /* burbuja del mentor / texto legible */
    --slate:       #948D7F;   /* texto secundario — gris cálido */
    --line:        rgba(218,190,104,.22);
    --shadow:      0 18px 50px rgba(0,0,0,.45);
    --radius:      14px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:'Montserrat',system-ui,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(1200px 520px at 50% -8%, rgba(218,190,104,.10), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    background-attachment:fixed;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
    -webkit-font-smoothing:antialiased;
  }

  /* La conversación vive dentro de una tarjeta definida (no flota plana) */
  .shell{
    width:100%;
    max-width:920px;
    min-width:0;
    display:flex;
    flex-direction:column;
    height:calc(100dvh - 36px);
    max-height:1100px;
    padding:0 26px;
    background:
      radial-gradient(900px 380px at 50% -12%, rgba(218,190,104,.07), transparent 60%),
      linear-gradient(180deg, rgba(34,31,26,.65) 0%, rgba(10,10,10,.45) 100%);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:
      0 36px 90px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(218,190,104,.08);
    overflow:hidden;
  }

  /* ---------- Header (la tesis: identidad de mentor) ---------- */
  header.brand{
    padding:26px 6px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:16px;
    opacity:0;
    transform:translateY(-8px);
    animation:enter .7s ease forwards;
  }
  .mark{
    flex:none;
    width:50px; height:50px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    overflow:hidden;
    position:relative;
    background:var(--navy-deep);
    animation:halo 3.6s ease-in-out infinite;
  }
  /* Encuadre del logo: recorta el wordmark y centra solo el ícono */
  .mark img, .avatar img{
    position:absolute;
    width:150%; height:150%;
    left:-25%; top:-6%;
    object-fit:cover;
    display:block;
  }
  .brand-text .eyebrow{
    font-size:10.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--slate);
    font-weight:600;
  }
  .brand-text h1{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:22px;
    color:var(--gold);
    line-height:1.1;
    margin:3px 0;
  }
  .brand-text .status{
    font-size:11.5px;
    color:var(--slate);
    display:flex; align-items:center; gap:7px;
  }
  .dot-live{
    width:7px; height:7px; border-radius:50%;
    background:#5fd08a;
    box-shadow:0 0 0 3px rgba(95,208,138,.18);
  }

  /* ---------- Stream de mensajes ---------- */
  .stream{
    flex:1 1 auto;
    overflow-y:auto;
    padding:22px 4px 8px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }
  .stream::-webkit-scrollbar{ width:8px; }
  .stream::-webkit-scrollbar-thumb{ background:rgba(143,163,179,.28); border-radius:8px; }

  .msg{
    max-width:84%;
    opacity:0;
    transform:translateY(8px);
    animation:enter .4s ease forwards;
  }
  .msg .who{
    font-size:9.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-soft);
    font-weight:600;
    margin:0 0 6px 2px;
  }
  .bubble{
    padding:14px 17px;
    font-size:14.5px;
    line-height:1.62;
    border-radius:var(--radius);
  }
  .bubble{ overflow-wrap:break-word; }
  .bubble a{ color:var(--gold); text-decoration:underline; word-break:break-word; }
  .bubble strong{ font-weight:600; }

  /* mentor */
  .msg.bot{
    align-self:flex-start;
    display:grid;
    grid-template-columns:30px minmax(0, 1fr);
    gap:10px;
    align-items:start;
  }
  .avatar{
    flex:none;
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--gold);
    overflow:hidden;
    position:relative;
    background:var(--navy-deep);
    margin-top:2px;
  }
  .bot-content{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .msg.bot .bubble{
    background:var(--cream);
    color:#1A1712;
    border-bottom-left-radius:4px;
    box-shadow:var(--shadow);
  }
  /* estudiante */
  .msg.user{ align-self:flex-end; }
  .msg.user .who{ text-align:right; color:var(--slate); }
  .msg.user .bubble{
    background:var(--navy-panel);
    color:var(--cream);
    border:1px solid var(--line);
    border-left:2px solid var(--gold);
    border-bottom-right-radius:4px;
  }

  /* typing */
  .typing .bubble{
    background:var(--cream);
    border-bottom-left-radius:4px;
    display:inline-flex; gap:5px; align-items:center;
    padding:16px 18px;
  }
  .typing span{
    width:7px; height:7px; border-radius:50%;
    background:#9bb0c0;
    animation:blink 1.3s infinite ease-in-out both;
  }
  .typing span:nth-child(2){ animation-delay:.18s; }
  .typing span:nth-child(3){ animation-delay:.36s; }

  /* ---------- Chips de sugerencia ---------- */
  .chips{
    display:flex; flex-wrap:wrap; gap:9px;
    padding:6px 4px 14px;
  }
  .chip{
    font-family:inherit;
    font-size:12.5px;
    color:var(--gold);
    background:transparent;
    border:1px solid var(--line);
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background .18s, border-color .18s, transform .18s;
  }
  .chip:hover{ background:rgba(218,190,104,.10); border-color:var(--gold); }
  .chip:active{ transform:scale(.97); }

  /* ---------- Barra de entrada ---------- */
  .composer{
    border-top:1px solid var(--line);
    padding:14px 4px calc(14px + env(safe-area-inset-bottom));
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .composer textarea{
    flex:1;
    resize:none;
    max-height:140px;
    overflow-y:auto;
    scrollbar-width:none;        /* Firefox */
    -ms-overflow-style:none;     /* Edge antiguo */
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    color:var(--cream);
    background:var(--navy-panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 15px;
    outline:none;
    transition:border-color .18s;
  }
  .composer textarea::placeholder{ color:var(--slate); }
  .composer textarea:focus{ border-color:var(--gold); }
  .composer textarea::-webkit-scrollbar{ display:none; }   /* Chrome/Safari/Edge */
  .send{
    flex:none;
    width:48px; height:48px;
    display:grid; place-items:center;
    color:var(--navy-deep);
    background:var(--gold);
    border:none;
    border-radius:50%;
    cursor:pointer;
    transition:background .18s, transform .12s, opacity .18s;
  }
  .send svg{ display:block; }
  .send:hover{ background:var(--gold-soft); }
  .send:active{ transform:scale(.97); }
  .send:disabled{ opacity:.45; cursor:not-allowed; }

  .footnote{
    text-align:center;
    font-size:10.5px;
    color:var(--slate);
    padding:0 8px 14px;
    line-height:1.5;
  }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }

  @keyframes enter{ to{ opacity:1; transform:none; } }
  @keyframes blink{ 0%,80%,100%{ transform:scale(.6); opacity:.4; } 40%{ transform:scale(1); opacity:1; } }
  @keyframes halo{
    0%,100%{ box-shadow:inset 0 0 16px rgba(218,190,104,.12), 0 0 0 0 rgba(218,190,104,0); }
    50%{ box-shadow:inset 0 0 18px rgba(218,190,104,.20), 0 0 18px 2px rgba(218,190,104,.28); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; }
    .stream{ scroll-behavior:auto; }
    .msg, header.brand{ opacity:1; transform:none; }
  }

  @media (max-width:560px){
    body{ padding:0; }
    .shell{
      max-width:100%;
      height:100dvh;
      border:none;
      border-radius:0;
      box-shadow:none;
      padding:0 16px;
      background:
        radial-gradient(900px 380px at 50% -8%, rgba(218,190,104,.08), transparent 60%),
        linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    }
    .brand-text h1{ font-size:19px; }
    .msg{ max-width:90%; }
    .send{ width:46px; height:46px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div class="mark" aria-hidden="true"><img src="/logo.png" alt=""></div>
      <div class="brand-text">
        <div class="eyebrow">Imperians Academy</div>
        <h1>Chatbot Fundamentum</h1>
        <div class="status"><span class="dot-live" aria-hidden="true"></span> Tu tutor de Meta Ads · disponible siempre</div>
      </div>
    </header>

    <main class="stream" id="stream" aria-live="polite" aria-label="Conversación con el mentor"></main>

    <div class="chips" id="chips" aria-label="Preguntas frecuentes"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Escribe tu duda sobre Meta Ads…" aria-label="Tu mensaje" autocomplete="off"></textarea>
      <button class="send" id="send" aria-label="Enviar mensaje" title="Enviar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <p class="footnote">Respuestas basadas en la metodología Fundamentum Ads. Para casos específicos de tu cuenta, te conectamos con soporte humano.</p>
  </div>

<script>
(function(){
  "use strict";

  /* ============================================================
     CONFIGURACIÓN — revisa estas dos líneas antes de publicar
     ============================================================ */
  // URL de PRODUCCIÓN del webhook en n8n (ojo: /webhook/ no /webhook-test/)
  const WEBHOOK_URL  = "https://n8n.srv1328359.hstgr.cloud/webhook/soporte-fundamentum";
  // Link de WhatsApp de soporte humano (se muestra solo si el bot no responde)
  const WHATSAPP_URL = "https://wa.me/584122125189";

  const WELCOME =
    "Bienvenido. Soy tu mentor del curso **Fundamentum Ads**.\n\n" +
    "Pregúntame lo que necesites sobre Meta Ads: configuración del Business Manager, pagos, campañas, creativos, métricas o cómo desbloquear una cuenta. Vamos directo al grano y con datos reales.";

  const SUGGESTIONS = [
    "¿Cómo creo mi Business Manager?",
    "Mi cuenta fue restringida, ¿qué hago?",
    "¿Qué objetivo de campaña debo usar?",
    "¿Cómo configuro el pago desde Venezuela?"
  ];

  /* ---------- Estado ---------- */
  const stream = document.getElementById('stream');
  const chips  = document.getElementById('chips');
  const input  = document.getElementById('input');
  const send   = document.getElementById('send');
  let busy = false;

  let sessionId = "";
  try {
    sessionId = localStorage.getItem('ffa_sid') || ('web-' + Math.random().toString(36).slice(2,11));
    localStorage.setItem('ffa_sid', sessionId);
  } catch(e){ sessionId = 'web-' + Math.random().toString(36).slice(2,11); }

  /* ---------- Utilidades de render ---------- */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }
  function format(text){
    let t = escapeHtml(text);
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\n/g, '<br>');
    return t;
  }

  function logoAvatar(){
    const a = document.createElement('div');
    a.className = 'avatar';
    a.setAttribute('aria-hidden', 'true');
    const img = document.createElement('img');
    img.src = '/logo.png';
    img.alt = '';
    a.appendChild(img);
    return a;
  }

  function addMessage(role, text){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'bot' ? 'Mentor' : 'Tú';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = format(text);
    if(role === 'bot'){
      const content = document.createElement('div');
      content.className = 'bot-content';
      content.appendChild(who);
      content.appendChild(bubble);
      wrap.appendChild(logoAvatar());
      wrap.appendChild(content);
    } else {
      wrap.appendChild(who);
      wrap.appendChild(bubble);
    }
    stream.appendChild(wrap);
    scrollDown();
  }

  function showTyping(){
    const wrap = document.createElement('div');
    wrap.className = 'msg bot typing';
    wrap.id = 'typing';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(logoAvatar());
    wrap.appendChild(bubble);
    stream.appendChild(wrap);
    scrollDown();
  }
  function hideTyping(){
    const t = document.getElementById('typing');
    if(t) t.remove();
  }
  function scrollDown(){ stream.scrollTop = stream.scrollHeight; }

  /* ---------- Envío ---------- */
  async function ask(text){
    if(busy || !text.trim()) return;
    busy = true; send.disabled = true;
    if(chips.children.length) chips.innerHTML = '';
    addMessage('user', text);
    input.value = ''; autosize();
    showTyping();

    try{
      const res = await fetch(WEBHOOK_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: text, from: sessionId })
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      hideTyping();
      const reply = (data && (data.respuesta || data.message || data.output)) || null;
      addMessage('bot', reply || fallbackText());
    }catch(err){
      hideTyping();
      addMessage('bot', connectionError());
    }finally{
      busy = false; send.disabled = false;
      input.focus();
    }
  }

  function fallbackText(){
    return "No logré armar una respuesta esta vez. Reformula la pregunta, o si es algo de tu cuenta escríbele al equipo: " + WHATSAPP_URL;
  }
  function connectionError(){
    return "Se cortó la conexión un momento. Espera unos segundos y vuelve a intentar. Si sigue fallando, escríbele al equipo de soporte por WhatsApp: " + WHATSAPP_URL;
  }

  /* ---------- Chips ---------- */
  function renderChips(){
    SUGGESTIONS.forEach(q => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = q;
      b.addEventListener('click', () => ask(q));
      chips.appendChild(b);
    });
  }

  /* ---------- Input ---------- */
  function autosize(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      ask(input.value);
    }
  });
  send.addEventListener('click', () => ask(input.value));

  /* ---------- Init ---------- */
  addMessage('bot', WELCOME);
  renderChips();
  input.focus();
})();
</script>
</body>
</html>
